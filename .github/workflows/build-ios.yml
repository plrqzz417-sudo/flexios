name: Build JM FlexMod iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S ios -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_SYSTEM_PROCESSOR=arm64
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ios --config Release --target jmflexmod_ios
      - name: Inspect artifact
        run: |
          dylib=$(find build-ios -name JMFlexMod.dylib -type f -print -quit)
          test -n "$dylib"
          file "$dylib"
          lipo -info "$dylib"
          otool -L "$dylib"
          cp "$dylib" JMFlexMod.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: JMFlexMod-iOS-arm64
          path: JMFlexMod.dylib
